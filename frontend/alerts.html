<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Centre — Dashboard Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/overview.html" class="navbar-brand">
      <span id="ws-status-dot" class="status-dot status-offline" title="Connecting..."></span>
      Industrial Monitor
    </a>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-right">
      <span id="nav-username" style="font-weight: 500;"></span>
      <span id="nav-role" class="text-muted" style="font-size: 0.8rem;"></span>
      <button id="logout-btn" class="btn btn-secondary btn-sm">Logout</button>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-between align-center mb-4">
      <div>
        <h2>Alert Centre</h2>
        <p class="text-muted">Operational watchdogs for device offline, camera fault, high thermal, and latency anomalies (B9)</p>
      </div>
    </div>
    
    <div class="tabs">
      <div class="tab active" data-state="active">Active Alerts</div>
      <div class="tab" data-state="acknowledged">Acknowledged</div>
      <div class="tab" data-state="cleared">Cleared History</div>
    </div>

    <div class="table-container">
      <table id="alerts-table">
        <thead>
          <tr>
            <th>Severity</th>
            <th>Rule / Incident</th>
            <th>Source Device</th>
            <th>Raised Time</th>
            <th>Ack By / Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/alerts.js"></script>
</body>
</html>
